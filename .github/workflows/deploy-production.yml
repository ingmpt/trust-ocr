# Entorno de PRODUCCIÓN (Server 1 — "SaaS Layer", Hetzner, IP pública dedicada
# distinta del servidor de apps de usuario final).
#
# DESACTIVADO (trigger automático deshabilitado): el despliegue actual usa el
# flujo MANUAL — git pull + `docker compose -f docker-compose.prod.yml up -d
# --build` directamente en el servidor (ver README). Este workflow queda
# guardado por si en el futuro se migra a build-and-push a GHCR + deploy por
# SSH; hoy referencia imágenes ghcr.io que docker-compose.prod.yml ya no usa
# (se convirtió a `build:` local). Se puede reactivar cambiando `on:` de vuelta
# a `push` y actualizando el paso de deploy.
# Barreras de promoción obligatorias (Directiva 4) si se reactiva:
#   1) Reutiliza el quality-gate (tests + cobertura >= 90%) — si falla, no se
#      construye ni se publica ninguna imagen.
#   2) Manual Gate: el job `deploy` corre contra el GitHub Environment
#      `production`, que debe tener un "required reviewer" configurado en
#      Settings > Environments. Se dispara solo con push a `main`, pero se
#      PAUSA hasta que un humano apruebe el despliegue real.
name: Deploy to production (Hetzner — Server 1 SaaS)

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_API: ghcr.io/trust-systems/trust-ocr-api
  IMAGE_FRONTEND: ghcr.io/trust-systems/trust-ocr-frontend

jobs:
  test:
    # Barrera 1: mismo quality-gate que staging, cobertura >= 90% obligatoria.
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image (also used by celery-worker/beat)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.IMAGE_API }}:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.PROD_API_BASE_URL || 'https://ocr.trustedtechnologyperu.com/api/v1' }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Barrera 2 (Manual Gate): configurar "Required reviewers" en este
    # environment desde Settings > Environments > production.
    environment:
      name: production
      url: https://ocr.trustedtechnologyperu.com
    steps:
      - uses: actions/checkout@v4

      - name: Sync docker-compose.prod.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          source: "docker-compose.prod.yml"
          target: "/opt/trust-ocr"

      - name: Pull & recreate containers, run migrations
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            set -euo pipefail
            cd /opt/trust-ocr
            export IMAGE_TAG=${{ github.sha }}
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env.bootstrap
            docker compose -f docker-compose.prod.yml --env-file .env.bootstrap pull
            docker compose -f docker-compose.prod.yml --env-file .env.bootstrap up -d --remove-orphans
            docker compose -f docker-compose.prod.yml --env-file .env.bootstrap exec -T api alembic upgrade head
            docker image prune -f
