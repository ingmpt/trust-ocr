# Producción — VPS con Traefik ya instalado y gestionando otras aplicaciones
# en ese mismo nodo. Requiere que la red externa `traefik-public` ya exista
# (creada por el Traefik que ya corre en el servidor; no se crea aquí).
# Único archivo de secretos: `.env` (mismo directorio que este compose, ver
# `.env.example`). Contiene las credenciales para autenticar contra Infisical;
# el resto de secretos de negocio (SECRET_KEY, GEMINI_API_KEY, R2_*, ZOHO_*,
# AUDIT_SIGNING_API_KEY, etc.) se obtienen en runtime desde Infisical
# (backend/app/bootstrap_secrets.py).
#
# Flujo de despliegue MANUAL: en el servidor,
#   cd /opt/trust-ocr && git pull && docker compose -f docker-compose.prod.yml up -d --build
# (Docker Compose carga automáticamente el archivo `.env` del mismo directorio,
# tanto para la sustitución de variables en este YAML como via `env_file:`.)
# Las imágenes se construyen localmente en el servidor a partir de
# backend/Dockerfile y frontend/Dockerfile (mismo contexto que en local).

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustocr_postgres_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - trustocr_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # VPS compartida de 3.7GiB reales — límites ajustados para no dejar sin RAM a otros stacks del nodo
    mem_limit: 256m
    mem_reservation: 128m
    # Sin `ports:` — solo alcanzable dentro de la red interna del compose
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: trustocr_redis_prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    volumes:
      - trustocr_redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 80m
    mem_reservation: 32m
    networks:
      - internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustocr_api_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OCR_ENGINE: paddleocr
      # OpenCV/scipy/PaddlePaddle cada uno trae su propio backend de threads/BLAS; sin esto
      # compiten en el mismo proceso y corrompen heap (crash "free(): invalid pointer").
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENCV_OPENCL_RUNTIME: "disabled"
      # glibc crea un arena de malloc por hilo; con librerias nativas (OpenBLAS/MKL/Paddle)
      # eso infla el RSS proporcional a lo que el cgroup permite, no a lo que hace falta
      # (visto: OOM siempre justo debajo del mem_limit, sin importar cual sea el limite).
      MALLOC_ARENA_MAX: "2"
      # PaddlePaddle preasigna un pool de memoria CPU como fraccion de lo "disponible"
      # detectado (no del tamano real del modelo/imagen) -- por eso el RSS escalaba con
      # cada mem_limit que probamos (1024m->1043MB, 1280m->1305MB, 1536m->1566MB). Se limita
      # explicitamente a una fraccion pequena.
      FLAGS_fraction_of_cpu_memory_to_use: "0.15"
    volumes:
      - trustocr_paddleocr_models_prod:/root/.paddleocr
    security_opt:
      - no-new-privileges:true
    # Límite de RAM: PaddleOCR por sí solo (modelos de detección/ángulo/reconocimiento) ya usa
    # varios cientos de MB al cargar; 700m resultó insuficiente en la práctica (OOM real en VPS).
    # 1024m y 1280m también murieron justo en el límite (dmesg: memcg OOM, anon-rss≈límite) --
    # confirmado como fuga real de PaddleInference (compila un grafo nuevo por cada forma de
    # imagen distinta y nunca lo libera): a 2048m también murió (~2089MB). Se corrige en
    # preprocessing.py forzando tamaño fijo de imagen; se vuelve a un límite seguro.
    mem_limit: 1024m
    mem_reservation: 400m
    networks:
      - internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.trustocr-api.rule=Host(`ocr.trustedtechnologyperu.com`)"
      - "traefik.http.routers.trustocr-api.entrypoints=websecure"
      - "traefik.http.routers.trustocr-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.trustocr-api.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.trustocr-api-headers.headers.stsSeconds=31536000"
      - "traefik.http.routers.trustocr-api.middlewares=trustocr-api-headers"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustocr_celery_worker_prod
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OCR_ENGINE: paddleocr
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENCV_OPENCL_RUNTIME: "disabled"
      MALLOC_ARENA_MAX: "2"
      FLAGS_fraction_of_cpu_memory_to_use: "0.15"
    volumes:
      - trustocr_paddleocr_models_prod:/root/.paddleocr
    security_opt:
      - no-new-privileges:true
    # concurrency=1: cada worker carga su propio modelo PaddleOCR en memoria; con 2 se duplicaba el riesgo de OOM
    mem_limit: 1024m
    mem_reservation: 400m
    networks:
      - internal

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustocr_celery_beat_prod
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    security_opt:
      - no-new-privileges:true
    # beat no ejecuta OCR, pero importa los mismos módulos de tareas (cv2, fitz, numpy) al arrancar
    mem_limit: 300m
    mem_reservation: 128m
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://ocr.trustedtechnologyperu.com/api/v1}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    container_name: trustocr_frontend_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    mem_reservation: 32m
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.trustocr-frontend.rule=Host(`app.trustedtechnologyperu.com`)"
      - "traefik.http.routers.trustocr-frontend.entrypoints=websecure"
      - "traefik.http.routers.trustocr-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.trustocr-frontend.loadbalancer.server.port=80"
      - "traefik.http.middlewares.trustocr-frontend-headers.headers.stsSeconds=31536000"
      - "traefik.http.routers.trustocr-frontend.middlewares=trustocr-frontend-headers"

networks:
  internal:
  traefik-public:
    external: true

volumes:
  trustocr_pgdata_prod:
  trustocr_redisdata_prod:
  trustocr_paddleocr_models_prod:
