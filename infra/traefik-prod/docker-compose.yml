# Stack de Traefik para el Server 1 de PRODUCCIÓN (Hetzner — "SaaS Layer",
# IP pública dedicada, distinta del Server 2 de apps de usuario final).
# Réplica del patrón usado en trust-building-manager/infra/traefik-prod:
# instancia de Traefik INDEPENDIENTE por servidor, aunque ambos vivan bajo la
# misma VPS física. TLS real vía Let's Encrypt (HTTP-01).
## Requiere:
#   - Puertos 80/443 abiertos en el firewall (UFW) de ESTE nodo (Server 1).
#   - DNS: registros A de ocr.trustedtechnologyperu.com y
#     app.trustedtechnologyperu.com (frontend) (y futuros
#     vault.trustedtechnologyperu.com / stamp.trustedtechnologyperu.com)
#     apuntando a la IP pública de Server 1.
#   - Variable ACME_EMAIL (contacto para Let's Encrypt) en .env junto a este compose.
#
# Uso:
#   docker network create traefik-public   # una sola vez
#   docker compose up -d
version: '3.9'

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--api.dashboard=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    networks:
      - traefik-public
    labels:
      # Dashboard NUNCA público sin auth — restringido a admin + basic auth.
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_DASHBOARD_HOST}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth,traefik-allowlist"
      - "traefik.http.middlewares.traefik-auth.basicauth.usersfile=/run/secrets/traefik_htpasswd"
      - "traefik.http.middlewares.traefik-allowlist.ipallowlist.sourcerange=${ADMIN_IP_ALLOWLIST}"
    secrets:
      - traefik_htpasswd

secrets:
  traefik_htpasswd:
    file: ./secrets/traefik_htpasswd

networks:
  traefik-public:
    external: true

volumes:
  letsencrypt:
